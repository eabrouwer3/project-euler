<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<!--
			`interactive-widget=resizes-content` makes the on-screen keyboard shrink the layout
			viewport instead of covering it, which is what keeps the editor's key bar and the Run
			button above the keyboard rather than behind it. Chrome honours it; Safari does not yet,
			so the app shell also measures `visualViewport` for itself.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
